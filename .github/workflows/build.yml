name: Build & Test

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build Mod JAR & Run JUnit 5 Suite
        run: ./gradlew test build --no-daemon

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qb2-mod-jar
          path: |
            build/libs/qb2-*.jar
            build/distributions/qb2-*-bundle.zip
